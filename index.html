<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>f(x) 아레나 — 함수 무기 스틱맨 액션</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1020'/%3E%3Cpath d='M4 26 Q12 26 16 16 T28 4' stroke='%233ad8ff' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <meta name="description" content="수학 함수를 무기로 장착해 그래프 모양으로 공격하는 2D 스틱맨 웨이브 액션 게임" />
  </head>
  <body>
    <canvas id="game" aria-label="게임 화면"></canvas>

    <section id="overlay-start" class="overlay" hidden>
      <div class="panel">
        <p class="eyebrow">FUNCTION ARSENAL</p>
        <h1><i>f</i>(<i>x</i>) 아레나</h1>
        <p class="lead">함수를 무기에 장착하면 그 <b>그래프 모양 그대로</b> 공격이 뻗어 나갑니다.<br />곡선의 모양을 활용해 몰려오는 스틱맨을 처치하세요.</p>
        <ul id="weapon-list" class="weapons"></ul>
        <div class="controls">
          <span><kbd>A</kbd><kbd>D</kbd> 이동</span>
          <span><kbd>W</kbd> 점프</span>
          <span><kbd>S</kbd> 숙이기</span>
          <span>마우스 조준 · <kbd>좌클릭</kbd> 공격</span>
          <span><kbd>1</kbd>~<kbd>5</kbd> / 휠 함수 교체</span>
          <span><kbd>Esc</kbd> 일시 정지</span>
        </div>
        <button id="btn-start" class="primary" type="button">게임 시작</button>
      </div>
    </section>

    <section id="overlay-pause" class="overlay" hidden>
      <div class="panel small">
        <h2>일시 정지</h2>
        <div class="controls">
          <span><kbd>A</kbd><kbd>D</kbd> 이동</span>
          <span><kbd>W</kbd> 점프</span>
          <span><kbd>S</kbd> 숙이기</span>
          <span>마우스 조준 · <kbd>좌클릭</kbd> 공격</span>
          <span><kbd>1</kbd>~<kbd>5</kbd> / 휠 함수 교체</span>
        </div>
        <div class="buttons">
          <button id="btn-resume" class="primary" type="button">계속하기 (Esc)</button>
          <button id="btn-pause-restart" type="button">처음부터 다시 시작</button>
        </div>
      </div>
    </section>

    <section id="overlay-gameover" class="overlay" hidden>
      <div class="panel small">
        <p class="eyebrow danger">GAME OVER</p>
        <h2>최종 점수 <span id="go-score">0</span></h2>
        <dl class="stats">
          <div><dt>도달 웨이브</dt><dd id="go-wave">0</dd></div>
          <div><dt>처치</dt><dd id="go-kills">0</dd></div>
          <div><dt>명중률</dt><dd id="go-acc">0%</dd></div>
        </dl>
        <p id="go-best" class="best"></p>
        <button id="btn-restart" class="primary" type="button">다시 시작</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
